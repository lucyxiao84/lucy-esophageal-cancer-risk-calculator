<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>食管癌风险计算器 - Project S.H.E.</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #eef2f7;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 820px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            padding: 28px 30px 40px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 4px;
        }
        .lang-btn {
            background: #1e5f8e;
            color: white;
            border: none;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .lang-btn:hover {
            background: #0b3b5a;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #0b2b4a;
            margin-bottom: 4px;
        }
        h1 small { font-size: 16px; font-weight: 400; color: #5b7b9a; }
        .disclaimer {
            background: #f8f9fa;
            border-left: 5px solid #d32f2f;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 13px;
            color: #555;
            margin-bottom: 24px;
        }
        .disclaimer strong { color: #d32f2f; }
        .section {
            margin-top: 28px;
            border-top: 1px solid #e6edf4;
            padding-top: 20px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a3a5a;
            margin-bottom: 16px;
        }
        .question {
            background: #f7fafc;
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 14px;
            border: 1px solid #e6edf4;
        }
        .question-label {
            font-weight: 600;
            font-size: 15px;
            color: #0b2b4a;
            display: block;
            margin-bottom: 8px;
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .options button {
            flex: 1 0 auto;
            min-width: 70px;
            padding: 6px 14px;
            border: 2px solid #d0dde8;
            background: white;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            color: #1a3a5a;
            cursor: pointer;
            transition: 0.15s;
        }
        .options button:hover {
            background: #e8f0fa;
            border-color: #8db0cc;
        }
        .options button.selected {
            background: #1e5f8e;
            border-color: #1e5f8e;
            color: white;
        }
        .btn-reset {
            background: white;
            border: 2px solid #b8ccdd;
            color: #1e3a5a;
            padding: 10px 32px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.1s;
            margin-top: 12px;
        }
        .btn-reset:hover {
            background: #eef4fa;
            border-color: #8aaec9;
        }
        .result-area {
            background: #e7f1fa;
            border-radius: 24px;
            padding: 22px 24px;
            margin: 28px 0 14px;
            text-align: center;
        }
        .result-area .score-number {
            font-size: 56px;
            font-weight: 800;
            color: #0b2b4a;
            line-height: 1.1;
        }
        .result-area .score-label {
            font-size: 18px;
            color: #2a4a6a;
        }
        .risk-badge {
            display: inline-block;
            padding: 6px 28px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 20px;
            margin-top: 6px;
        }
        .risk-low { background: #d4edda; color: #0b6e3b; }
        .risk-medium { background: #fff3cd; color: #856404; }
        .risk-high { background: #f8d7da; color: #9e2f3a; }
        .risk-veryhigh { background: #dc3545; color: white; }
        .advice-text {
            font-size: 15px;
            color: #1a3a5a;
            margin-top: 10px;
            padding: 10px 16px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }
        .detail-toggle {
            background: none;
            border: none;
            color: #1e5f8e;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            text-decoration: underline;
        }
        .detail-table {
            display: none;
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            margin-top: 12px;
            text-align: left;
        }
        .detail-table td {
            padding: 4px 6px;
            border-bottom: 1px solid #e2eaf2;
        }
        .detail-table .factor-name { color: #2a4a6a; }
        .detail-table .factor-score { font-weight: 600; text-align: right; }
        .footer-note {
            font-size: 12px;
            color: #6a8aaa;
            text-align: center;
            border-top: 1px solid #e2eaf2;
            padding-top: 18px;
            margin-top: 22px;
        }
        @media (max-width: 500px) {
            .container { padding: 16px; }
            .options button { flex: 1 1 45%; }
            .header { flex-direction: column; align-items: stretch; }
            .lang-btn { align-self: flex-end; }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="header">
        <h1>🫀 <span id="titleMain">食管癌风险</span> <small>Project S.H.E.</small></h1>
        <button class="lang-btn" id="langToggle">English</button>
    </div>

    <div class="disclaimer" id="disclaimer">
        <strong>⚠️ 免责声明：</strong> 本工具仅供 <strong>教育及科研</strong> 用途，不提供医疗建议、诊断或治疗。如有健康问题，请咨询专业医生。
    </div>

    <div id="questions"></div>

    <div style="text-align: center; margin: 10px 0 6px;">
        <button class="btn-reset" id="resetBtn">🔄 <span id="resetText">重新评估</span></button>
    </div>

    <div id="resultArea" class="result-area" style="display: none;">
        <div class="score-label" id="scoreLabel">总风险评分</div>
        <div class="score-number" id="totalScore">0.00</div>
        <div style="margin: 6px 0 4px;">
            <span class="risk-badge" id="riskBadge">低风险</span>
        </div>
        <div class="advice-text" id="adviceText">继续保持良好习惯！</div>
        <button class="detail-toggle" id="detailToggle">📋 <span id="detailToggleText">查看详细得分</span></button>
        <table class="detail-table" id="detailTable"></table>
    </div>

    <div class="footer-note" id="footerNote">
        本工具基于2023年中国食管癌风险因素系统综述 · 仅供学术参考
    </div>
</div>

<script>
    // ============================================
    // 常量（保持不变）
    // ============================================
    const RISK_TOTAL = 24.52;
    const PROT_TOTAL = 4.115;
    const COMBINED = RISK_TOTAL + PROT_TOTAL;
    const RISK_COEFF = RISK_TOTAL / COMBINED;
    const PROT_COEFF = PROT_TOTAL / COMBINED;
    const OFFSET = 14.4;

    // ============================================
    // 语言包
    // ============================================
    const LANG = {
        zh: {
            title: '食管癌风险',
            disclaimer: '⚠️ 免责声明： 本工具仅供 教育及科研 用途，不提供医疗建议、诊断或治疗。如有健康问题，请咨询专业医生。',
            reset: '重新评估',
            scoreLabel: '总风险评分',
            detailView: '查看详细得分',
            detailHide: '隐藏详细得分',
            footer: '本工具基于2023年中国食管癌风险因素系统综述 · 仅供学术参考',
            riskSection: '⚠️ 风险因素',
            protectSection: '🛡️ 保护因素（可降低风险）',
            noDetail: '所有选项均为最低风险或无暴露',
            riskLevels: {
                low: '低风险',
                moderate: '中等风险',
                high: '高风险',
                veryHigh: '极高风险'
            },
            advice: {
                low: '保持良好生活习惯，定期关注健康。',
                moderate: '建议改善饮食和生活方式。如有疑虑可咨询医生。',
                high: '建议咨询消化科医生，进行进一步评估。',
                veryHigh: '请尽快就医，进行胃镜等相关检查。'
            },
            factors: {
                age: '年龄',
                sex: '性别',
                smoking: '吸烟',
                alcohol: '饮酒',
                hot: '热烫饮食',
                eatfast: '进食过快',
                pickled: '腌制食品',
                moldy: '霉变食物',
                hard: '喜硬食',
                firstfh: '一级亲属家族史',
                secondfh: '二级亲属家族史',
                hpv: 'HPV感染',
                trauma: '心理创伤',
                dep: '抑郁',
                anger: '生闷气/压抑愤怒',
                irritable: '易怒性格',
                veg: '新鲜蔬菜',
                fruit: '新鲜水果',
                soy: '豆类制品',
                meat: '肉蛋奶类',
                tea: '饮茶 (<65°C)',
                outgoing: '外向性格',
                relation: '良好人际关系'
            },
            opts: {
                almostNever: '几乎从不',
                occasionally: '偶尔',
                often: '经常',
                almostEveryday: '几乎每天',
                yes: '是',
                no: '否',
                female: '女性',
                male: '男性',
                age1: '< 51岁',
                age2: '51–60岁',
                age3: '> 60岁'
            }
        },
        en: {
            title: 'Esophageal Cancer Risk',
            disclaimer: '⚠️ Disclaimer: This tool is for educational and research purposes only. It does NOT provide medical advice, diagnosis, or treatment. Please consult a qualified healthcare professional for any health concerns.',
            reset: 'Reset',
            scoreLabel: 'Total Risk Score',
            detailView: 'View Detailed Score',
            detailHide: 'Hide Detailed Score',
            footer: 'Based on 2023 systematic review of esophageal cancer risk factors in Chinese populations · For academic reference only',
            riskSection: '⚠️ Risk Factors',
            protectSection: '🛡️ Protective Factors (Reduce Risk)',
            noDetail: 'All selections are at lowest risk or no exposure',
            riskLevels: {
                low: 'Low Risk',
                moderate: 'Moderate Risk',
                high: 'High Risk',
                veryHigh: 'Very High Risk'
            },
            advice: {
                low: 'Maintain healthy habits and continue regular check-ups.',
                moderate: 'Consider improving diet and lifestyle. Consult a doctor if concerned.',
                high: 'It is recommended to consult a gastroenterologist for further evaluation.',
                veryHigh: 'Please seek medical attention as soon as possible for comprehensive examination.'
            },
            factors: {
                age: 'Age',
                sex: 'Sex',
                smoking: 'Smoking',
                alcohol: 'Alcohol Consumption',
                hot: 'Hot Food & Drinks',
                eatfast: 'Eating Too Fast',
                pickled: 'Pickled Food',
                moldy: 'Moldy Food',
                hard: 'Hard Food',
                firstfh: 'First-degree Family History',
                secondfh: 'Second-degree Family History',
                hpv: 'HPV Infection',
                trauma: 'Psychological Trauma',
                dep: 'Depression',
                anger: 'Anger Suppression',
                irritable: 'Irritable Personality',
                veg: 'Fresh Vegetables',
                fruit: 'Fresh Fruits',
                soy: 'Soy Products',
                meat: 'Meat, Egg, Dairy',
                tea: 'Tea (<65°C)',
                outgoing: 'Outgoing Personality',
                relation: 'Good Interpersonal Relationships'
            },
            opts: {
                almostNever: 'Almost Never',
                occasionally: 'Occasionally',
                often: 'Often',
                almostEveryday: 'Almost Everyday',
                yes: 'Yes',
                no: 'No',
                female: 'Female',
                male: 'Male',
                age1: '< 51 years',
                age2: '51–60 years',
                age3: '> 60 years'
            }
        }
    };

    // ============================================
    // 风险因素数据（与语言无关）
    // ============================================
    const riskFactors = [
        { id: 'age', key: 'age', optKeys: ['age1', 'age2', 'age3'], scores: [0, 4.68, 14.03] },
        { id: 'sex', key: 'sex', optKeys: ['female', 'male'], scores: [0, 1.22] },
        { id: 'smoke', key: 'smoking', optKeys: ['almostNever', 'occasionally', 'often', 'almostEveryday'], scores: [0, 1.01, 2.01, 3.02] },
        { id: 'alcohol', key: 'alcohol', optKeys: ['almostNever', 'occasionally', 'often', 'almostEveryday'], scores: [0, 1.82, 3.64, 5.46] },
        { id: 'hot', key: 'hot', optKeys: ['almostNever', 'occasionally', 'often', 'almostEveryday'], scores: [0, 2.13, 4.27, 6.40] },
        { id: 'eatfast', key: 'eatfast', optKeys: ['almostNever', 'occasionally', 'often', 'almostEveryday'], scores: [0, 1.58, 3.15, 4.73] },
        { id: 'pickled', key: 'pickled', optKeys: ['almostNever', 'occasionally', 'often', 'almostEveryday'], scores: [0, 1.28, 2.56, 3.83] },
        { id: 'moldy', key: 'moldy', optKeys: ['almostNever', 'occasionally', 'often', 'almostEveryday'], scores: [0, 1.84, 3.67, 5.51] },
        { id: 'hard', key: 'hard', optKeys: ['almostNever', 'occasionally', 'often', 'almostEveryday'], scores: [0, 1.67, 3.34, 5.02] },
        { id: 'firstfh', key: 'firstfh', optKeys: ['no', 'yes'], scores: [0, 11.09] },
        { id: 'secondfh', key: 'secondfh', optKeys: ['no', 'yes'], scores: [0, 1.84] },
        { id: 'hpv', key: 'hpv', optKeys: ['no', 'yes'], scores: [0, 9.38] },
        { id: 'trauma', key: 'trauma', optKeys: ['no', 'yes'], scores: [0, 5.55] },
        { id: 'dep', key: 'dep', optKeys: ['almostNever', 'occasionally', 'often', 'almostEveryday'], scores: [0, 4.08, 8.16, 12.23] },
        { id: 'anger', key: 'anger', optKeys: ['almostNever', 'occasionally', 'often', 'almostEveryday'], scores: [0, 2.03, 4.05, 6.08] },
        { id: 'irritable', key: 'irritable', optKeys: ['almostNever', 'occasionally', 'often', 'almostEveryday'], scores: [0, 1.54, 3.07, 4.61] }
    ];

    const protectiveFactors = [
        { id: 'veg', key: 'veg', optKeys: ['almostNever', 'occasionally', 'often', 'almostEveryday'], scores: [0, 5.10, 10.21, 15.31] },
        { id: 'fruit', key: 'fruit', optKeys: ['almostNever', 'occasionally', 'often', 'almostEveryday'], scores: [0, 4.29, 8.59, 12.88] },
        { id: 'soy', key: 'soy', optKeys: ['almostNever', 'occasionally', 'often', 'almostEveryday'], scores: [0, 4.62, 9.23, 13.85] },
        { id: 'meat', key: 'meat', optKeys: ['almostNever', 'occasionally', 'often', 'almostEveryday'], scores: [0, 6.89, 13.77, 20.66] },
        { id: 'tea', key: 'tea', optKeys: ['almostNever', 'occasionally', 'often', 'almostEveryday'], scores: [0, 2.23, 4.46, 6.68] },
        { id: 'outgoing', key: 'outgoing', optKeys: ['no', 'yes'], scores: [0, 14.82] },
        { id: 'relation', key: 'relation', optKeys: ['no', 'yes'], scores: [0, 15.80] }
    ];

    // ============================================
    // 状态
    // ============================================
    let currentLang = 'zh';
    const container = document.getElementById('questions');
    const selections = {};

    // ============================================
    // 获取翻译文本
    // ============================================
    function t(key) {
        const keys = key.split('.');
        let val = LANG[currentLang];
        for (let k of keys) {
            if (val && val[k] !== undefined) val = val[k];
            else return key;
        }
        return val;
    }

    function getFactorLabel(key) {
        return t('factors.' + key);
    }

    function getOptText(optKey) {
        return t('opts.' + optKey);
    }

    // ============================================
    // 渲染界面
    // ============================================
    function renderQuestions() {
        container.innerHTML = '';

        // 风险因素部分
        const riskSection = document.createElement('div');
        riskSection.className = 'section';
        const riskTitle = document.createElement('div');
        riskTitle.className = 'section-title';
        riskTitle.textContent = t('riskSection');
        riskSection.appendChild(riskTitle);
        container.appendChild(riskSection);

        riskFactors.forEach(f => {
            const group = document.createElement('div');
            group.className = 'question';
            const label = document.createElement('span');
            label.className = 'question-label';
            label.textContent = getFactorLabel(f.key);
            group.appendChild(label);
            const optDiv = document.createElement('div');
            optDiv.className = 'options';
            f.optKeys.forEach((optKey, idx) => {
                const btn = document.createElement('button');
                btn.textContent = getOptText(optKey);
                btn.dataset.factorId = f.id;
                btn.dataset.idx = idx;
                btn.addEventListener('click', function() {
                    const siblings = this.parentElement.querySelectorAll('button');
                    siblings.forEach(b => b.classList.remove('selected'));
                    this.classList.add('selected');
                    selections[f.id] = idx;
                    calculateAndShow();
                });
                optDiv.appendChild(btn);
            });
            group.appendChild(optDiv);
            container.appendChild(group);
            if (selections[f.id] === undefined) selections[f.id] = 0;
        });

        // 保护因素部分
        const protSection = document.createElement('div');
        protSection.className = 'section';
        const protTitle = document.createElement('div');
        protTitle.className = 'section-title';
        protTitle.textContent = t('protectSection');
        protSection.appendChild(protTitle);
        container.appendChild(protSection);

        protectiveFactors.forEach(f => {
            const group = document.createElement('div');
            group.className = 'question';
            const label = document.createElement('span');
            label.className = 'question-label';
            label.textContent = getFactorLabel(f.key);
            group.appendChild(label);
            const optDiv = document.createElement('div');
            optDiv.className = 'options';
            f.optKeys.forEach((optKey, idx) => {
                const btn = document.createElement('button');
                btn.textContent = getOptText(optKey);
                btn.dataset.factorId = f.id;
                btn.dataset.idx = idx;
                btn.addEventListener('click', function() {
                    const siblings = this.parentElement.querySelectorAll('button');
                    siblings.forEach(b => b.classList.remove('selected'));
                    this.classList.add('selected');
                    selections[f.id] = idx;
                    calculateAndShow();
                });
                optDiv.appendChild(btn);
            });
            group.appendChild(optDiv);
            container.appendChild(group);
            if (selections[f.id] === undefined) selections[f.id] = 0;
        });

        // 选中状态恢复
        document.querySelectorAll('.question').forEach(q => {
            const btns = q.querySelectorAll('.options button');
            // 找到对应的因素
            const firstBtn = btns[0];
            if (firstBtn) {
                const factorId = firstBtn.dataset.factorId;
                const selIdx = selections[factorId] || 0;
                btns.forEach((b, i) => {
                    b.classList.toggle('selected', i === selIdx);
                });
            }
        });
    }

    // ============================================
    // 更新所有文字（不重新渲染）
    // ============================================
    function updateTexts() {
        document.getElementById('titleMain').textContent = t('title');
        document.getElementById('disclaimer').innerHTML = t('disclaimer');
        document.getElementById('resetText').textContent = t('reset');
        document.getElementById('scoreLabel').textContent = t('scoreLabel');
        document.getElementById('detailToggleText').textContent = document.getElementById('detailTable').style.display === 'table' ? t('detailHide') : t('detailView');
        document.getElementById('footerNote').textContent = t('footer');
        // 重新渲染问题（因为选项文字也变了）
        renderQuestions();
        // 重新计算结果
        calculateAndShow();
    }

    // ============================================
    // 语言切换
    // ============================================
    document.getElementById('langToggle').addEventListener('click', function() {
        currentLang = currentLang === 'zh' ? 'en' : 'zh';
        this.textContent = currentLang === 'zh' ? 'English' : '中文';
        updateTexts();
    });

    // ============================================
    // 计算与显示
    // ============================================
    function calculateAndShow() {
        let riskScore = 0;
        riskFactors.forEach(f => {
            const idx = selections[f.id] || 0;
            riskScore += f.scores[idx];
        });

        let protScore = 0;
        protectiveFactors.forEach(f => {
            const idx = selections[f.id] || 0;
            protScore += f.scores[idx];
        });

        const totalScore = (riskScore * RISK_COEFF) - (protScore * PROT_COEFF) + OFFSET;
        const displayScore = Math.min(100, Math.max(0, totalScore));

        let level, advice, cssClass;
        if (displayScore <= 20) {
            level = t('riskLevels.low');
            advice = t('advice.low');
            cssClass = 'risk-low';
        } else if (displayScore <= 45) {
            level = t('riskLevels.moderate');
            advice = t('advice.moderate');
            cssClass = 'risk-medium';
        } else if (displayScore <= 70) {
            level = t('riskLevels.high');
            advice = t('advice.high');
            cssClass = 'risk-high';
        } else {
            level = t('riskLevels.veryHigh');
            advice = t('advice.veryHigh');
            cssClass = 'risk-veryhigh';
        }

        document.getElementById('totalScore').textContent = displayScore.toFixed(2);
        const badge = document.getElementById('riskBadge');
        badge.textContent = level;
        badge.className = 'risk-badge ' + cssClass;
        document.getElementById('adviceText').textContent = advice;

        // 详细得分
        const table = document.getElementById('detailTable');
        table.innerHTML = '';

        let riskDetail = '';
        riskFactors.forEach(f => {
            const idx = selections[f.id] || 0;
            const weighted = f.scores[idx] * RISK_COEFF;
            if (weighted > 0.01) {
                riskDetail += `<tr><td class="factor-name">${getFactorLabel(f.key)}</td><td class="factor-score">${weighted.toFixed(2)}</td></tr>`;
            }
        });
        let protDetail = '';
        protectiveFactors.forEach(f => {
            const idx = selections[f.id] || 0;
            const weighted = f.scores[idx] * PROT_COEFF;
            if (weighted > 0.01) {
                protDetail += `<tr><td class="factor-name">${getFactorLabel(f.key)}</td><td class="factor-score">${weighted.toFixed(2)}</td></tr>`;
            }
        });

        if (riskDetail) {
            table.innerHTML += `<tr><td colspan="2" style="font-weight:600; padding-top:8px;">${t('riskSection')}</td></tr>`;
            table.innerHTML += riskDetail;
        }
        if (protDetail) {
            table.innerHTML += `<tr><td colspan="2" style="font-weight:600; padding-top:8px;">${t('protectSection')}</td></tr>`;
            table.innerHTML += protDetail;
        }
        if (!riskDetail && !protDetail) {
            table.innerHTML = `<tr><td colspan="2" style="text-align:center; color:#888;">${t('noDetail')}</td></tr>`;
        }

        document.getElementById('resultArea').style.display = 'block';
        // 更新明细按钮文字
        document.getElementById('detailToggleText').textContent = table.style.display === 'table' ? t('detailHide') : t('detailView');
    }

    // ============================================
    // 重置
    // ============================================
    document.getElementById('resetBtn').addEventListener('click', function() {
        riskFactors.forEach(f => selections[f.id] = 0);
        protectiveFactors.forEach(f => selections[f.id] = 0);
        document.querySelectorAll('.question').forEach(q => {
            const firstBtn = q.querySelector('.options button');
            if (firstBtn) {
                q.querySelectorAll('.options button').forEach(b => b.classList.remove('selected'));
                firstBtn.classList.add('selected');
            }
        });
        document.getElementById('resultArea').style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // ============================================
    // 切换详细得分
    // ============================================
    document.getElementById('detailToggle').addEventListener('click', function() {
        const table = document.getElementById('detailTable');
        if (table.style.display === 'table') {
            table.style.display = 'none';
            document.getElementById('detailToggleText').textContent = t('detailView');
        } else {
            table.style.display = 'table';
            document.getElementById('detailToggleText').textContent = t('detailHide');
        }
    });

    // ============================================
    // 初始化
    // ============================================
    renderQuestions();
    window.addEventListener('load', function() {
        // 确保默认选中
        document.querySelectorAll('.question').forEach(q => {
            const btns = q.querySelectorAll('.options button');
            const firstBtn = btns[0];
            if (firstBtn) {
                const factorId = firstBtn.dataset.factorId;
                const selIdx = selections[factorId] || 0;
                btns.forEach((b, i) => {
                    b.classList.toggle('selected', i === selIdx);
                });
            }
        });
        calculateAndShow();
    });
</script>
</body>
</html>
