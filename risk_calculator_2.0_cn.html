<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>食管癌风险计算器 - Project S.H.E.</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #eef2f7;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 820px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            padding: 28px 30px 40px;
        }
        .disclaimer {
            background: #f8f9fa;
            border-left: 5px solid #d32f2f;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 13px;
            color: #555;
            margin-bottom: 24px;
        }
        .disclaimer strong { color: #d32f2f; }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #0b2b4a;
            margin-bottom: 4px;
        }
        h1 small { font-size: 16px; font-weight: 400; color: #5b7b9a; }
        .section {
            margin-top: 28px;
            border-top: 1px solid #e6edf4;
            padding-top: 20px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a3a5a;
            margin-bottom: 16px;
        }
        .question {
            background: #f7fafc;
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 14px;
            border: 1px solid #e6edf4;
        }
        .question-label {
            font-weight: 600;
            font-size: 15px;
            color: #0b2b4a;
            display: block;
            margin-bottom: 8px;
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .options button {
            flex: 1 0 auto;
            min-width: 70px;
            padding: 6px 14px;
            border: 2px solid #d0dde8;
            background: white;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            color: #1a3a5a;
            cursor: pointer;
            transition: 0.15s;
        }
        .options button:hover {
            background: #e8f0fa;
            border-color: #8db0cc;
        }
        .options button.selected {
            background: #1e5f8e;
            border-color: #1e5f8e;
            color: white;
        }
        .btn-reset {
            background: white;
            border: 2px solid #b8ccdd;
            color: #1e3a5a;
            padding: 10px 32px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.1s;
            margin-top: 12px;
        }
        .btn-reset:hover {
            background: #eef4fa;
            border-color: #8aaec9;
        }
        .result-area {
            background: #e7f1fa;
            border-radius: 24px;
            padding: 22px 24px;
            margin: 28px 0 14px;
            text-align: center;
        }
        .result-area .score-number {
            font-size: 56px;
            font-weight: 800;
            color: #0b2b4a;
            line-height: 1.1;
        }
        .result-area .score-label {
            font-size: 18px;
            color: #2a4a6a;
        }
        .risk-badge {
            display: inline-block;
            padding: 6px 28px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 20px;
            margin-top: 6px;
        }
        .risk-low { background: #d4edda; color: #0b6e3b; }
        .risk-medium { background: #fff3cd; color: #856404; }
        .risk-high { background: #f8d7da; color: #9e2f3a; }
        .risk-veryhigh { background: #dc3545; color: white; }
        .advice-text {
            font-size: 15px;
            color: #1a3a5a;
            margin-top: 10px;
            padding: 10px 16px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }
        .detail-toggle {
            background: none;
            border: none;
            color: #1e5f8e;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            text-decoration: underline;
        }
        .detail-table {
            display: none;
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            margin-top: 12px;
            text-align: left;
        }
        .detail-table td {
            padding: 4px 6px;
            border-bottom: 1px solid #e2eaf2;
        }
        .detail-table .factor-name { color: #2a4a6a; }
        .detail-table .factor-score { font-weight: 600; text-align: right; }
        .footer-note {
            font-size: 12px;
            color: #6a8aaa;
            text-align: center;
            border-top: 1px solid #e2eaf2;
            padding-top: 18px;
            margin-top: 22px;
        }
        @media (max-width: 500px) {
            .container { padding: 16px; }
            .options button { flex: 1 1 45%; }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1>🫀 食管癌风险 <small>Project S.H.E.</small></h1>

    <div class="disclaimer">
        <strong>⚠️ 免责声明：</strong> 本工具仅供 <strong>教育及科研</strong> 用途，不提供医疗建议、诊断或治疗。如有健康问题，请咨询专业医生。
    </div>

    <!-- 所有问题由 JavaScript 动态生成 -->
    <div id="questions"></div>

    <div style="text-align: center; margin: 10px 0 6px;">
        <button class="btn-reset" id="resetBtn">🔄 重新评估</button>
    </div>

    <div id="resultArea" class="result-area" style="display: none;">
        <div class="score-label">总风险评分</div>
        <div class="score-number" id="totalScore">0.00</div>
        <div style="margin: 6px 0 4px;">
            <span class="risk-badge" id="riskBadge">低风险</span>
        </div>
        <div class="advice-text" id="adviceText">继续保持良好习惯！</div>
        <button class="detail-toggle" id="detailToggle">📋 查看详细得分</button>
        <table class="detail-table" id="detailTable"></table>
    </div>

    <div class="footer-note">
        本工具基于2023年中国食管癌风险因素系统综述 · 仅供学术参考
    </div>
</div>

<script>
    // ============================================
    // 常量（与 Python 版本完全一致）
    // ============================================
    const RISK_TOTAL = 24.52;
    const PROT_TOTAL = 4.115;
    const COMBINED = RISK_TOTAL + PROT_TOTAL;
    const RISK_COEFF = RISK_TOTAL / COMBINED;
    const PROT_COEFF = PROT_TOTAL / COMBINED;
    const OFFSET = 14.4;

    // ============================================
    // 风险因素（16个）
    // ============================================
    const riskFactors = [
        { id: 'age', label: '年龄', options: [{text:'< 51岁', score:0}, {text:'51–60岁', score:4.68}, {text:'> 60岁', score:14.03}] },
        { id: 'sex', label: '性别', options: [{text:'女性', score:0}, {text:'男性', score:1.22}] },
        { id: 'smoke', label: '吸烟', options: [{text:'几乎从不', score:0}, {text:'偶尔', score:1.01}, {text:'经常', score:2.01}, {text:'几乎每天', score:3.02}] },
        { id: 'alcohol', label: '饮酒', options: [{text:'几乎从不', score:0}, {text:'偶尔', score:1.82}, {text:'经常', score:3.64}, {text:'几乎每天', score:5.46}] },
        { id: 'hot', label: '热烫饮食', options: [{text:'几乎从不', score:0}, {text:'偶尔', score:2.13}, {text:'经常', score:4.27}, {text:'几乎每天', score:6.40}] },
        { id: 'eatfast', label: '进食过快', options: [{text:'几乎从不', score:0}, {text:'偶尔', score:1.58}, {text:'经常', score:3.15}, {text:'几乎每天', score:4.73}] },
        { id: 'pickled', label: '腌制食品', options: [{text:'几乎从不', score:0}, {text:'偶尔', score:1.28}, {text:'经常', score:2.56}, {text:'几乎每天', score:3.83}] },
        { id: 'moldy', label: '霉变食物', options: [{text:'几乎从不', score:0}, {text:'偶尔', score:1.84}, {text:'经常', score:3.67}, {text:'几乎每天', score:5.51}] },
        { id: 'hard', label: '喜硬食', options: [{text:'几乎从不', score:0}, {text:'偶尔', score:1.67}, {text:'经常', score:3.34}, {text:'几乎每天', score:5.02}] },
        { id: 'firstfh', label: '一级亲属家族史', options: [{text:'无', score:0}, {text:'有', score:11.09}] },
        { id: 'secondfh', label: '二级亲属家族史', options: [{text:'无', score:0}, {text:'有', score:1.84}] },
        { id: 'hpv', label: 'HPV感染', options: [{text:'无', score:0}, {text:'有', score:9.38}] },
        { id: 'trauma', label: '心理创伤', options: [{text:'无', score:0}, {text:'有', score:5.55}] },
        { id: 'dep', label: '抑郁', options: [{text:'几乎从不', score:0}, {text:'偶尔', score:4.08}, {text:'经常', score:8.16}, {text:'几乎每天', score:12.23}] },
        { id: 'anger', label: '生闷气/压抑愤怒', options: [{text:'几乎从不', score:0}, {text:'偶尔', score:2.03}, {text:'经常', score:4.05}, {text:'几乎每天', score:6.08}] },
        { id: 'irritable', label: '易怒性格', options: [{text:'几乎从不', score:0}, {text:'偶尔', score:1.54}, {text:'经常', score:3.07}, {text:'几乎每天', score:4.61}] }
    ];

    // ============================================
    // 保护因素（7个）
    // ============================================
    const protectiveFactors = [
        { id: 'veg', label: '新鲜蔬菜', options: [{text:'几乎从不', score:0}, {text:'偶尔', score:5.10}, {text:'经常', score:10.21}, {text:'几乎每天', score:15.31}] },
        { id: 'fruit', label: '新鲜水果', options: [{text:'几乎从不', score:0}, {text:'偶尔', score:4.29}, {text:'经常', score:8.59}, {text:'几乎每天', score:12.88}] },
        { id: 'soy', label: '豆类制品', options: [{text:'几乎从不', score:0}, {text:'偶尔', score:4.62}, {text:'经常', score:9.23}, {text:'几乎每天', score:13.85}] },
        { id: 'meat', label: '肉蛋奶类', options: [{text:'几乎从不', score:0}, {text:'偶尔', score:6.89}, {text:'经常', score:13.77}, {text:'几乎每天', score:20.66}] },
        { id: 'tea', label: '饮茶 (<65°C)', options: [{text:'几乎从不', score:0}, {text:'偶尔', score:2.23}, {text:'经常', score:4.46}, {text:'几乎每天', score:6.68}] },
        { id: 'outgoing', label: '外向性格', options: [{text:'否', score:0}, {text:'是', score:14.82}] },
        { id: 'relation', label: '良好人际关系', options: [{text:'否', score:0}, {text:'是', score:15.80}] }
    ];

    // ============================================
    // 渲染界面
    // ============================================
    const container = document.getElementById('questions');
    const selections = {};

    function renderQuestions() {
        // 风险因素部分
        const riskSection = document.createElement('div');
        riskSection.className = 'section';
        const riskTitle = document.createElement('div');
        riskTitle.className = 'section-title';
        riskTitle.textContent = '⚠️ 风险因素';
        riskSection.appendChild(riskTitle);
        container.appendChild(riskSection);

        riskFactors.forEach(f => {
            const group = document.createElement('div');
            group.className = 'question';
            const label = document.createElement('span');
            label.className = 'question-label';
            label.textContent = f.label;
            group.appendChild(label);
            const optDiv = document.createElement('div');
            optDiv.className = 'options';
            f.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.textContent = opt.text;
                btn.dataset.factorId = f.id;
                btn.dataset.idx = idx;
                btn.addEventListener('click', function() {
                    const siblings = this.parentElement.querySelectorAll('button');
                    siblings.forEach(b => b.classList.remove('selected'));
                    this.classList.add('selected');
                    selections[f.id] = idx;
                    calculateAndShow();
                });
                optDiv.appendChild(btn);
            });
            group.appendChild(optDiv);
            container.appendChild(group);
            selections[f.id] = 0;
        });

        // 保护因素部分
        const protSection = document.createElement('div');
        protSection.className = 'section';
        const protTitle = document.createElement('div');
        protTitle.className = 'section-title';
        protTitle.textContent = '🛡️ 保护因素（可降低风险）';
        protSection.appendChild(protTitle);
        container.appendChild(protSection);

        protectiveFactors.forEach(f => {
            const group = document.createElement('div');
            group.className = 'question';
            const label = document.createElement('span');
            label.className = 'question-label';
            label.textContent = f.label;
            group.appendChild(label);
            const optDiv = document.createElement('div');
            optDiv.className = 'options';
            f.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.textContent = opt.text;
                btn.dataset.factorId = f.id;
                btn.dataset.idx = idx;
                btn.addEventListener('click', function() {
                    const siblings = this.parentElement.querySelectorAll('button');
                    siblings.forEach(b => b.classList.remove('selected'));
                    this.classList.add('selected');
                    selections[f.id] = idx;
                    calculateAndShow();
                });
                optDiv.appendChild(btn);
            });
            group.appendChild(optDiv);
            container.appendChild(group);
            selections[f.id] = 0;
        });

        // 默认选中第一个选项
        document.querySelectorAll('.question').forEach(q => {
            const firstBtn = q.querySelector('.options button');
            if (firstBtn) firstBtn.classList.add('selected');
        });
    }

    // ============================================
    // 计算与显示
    // ============================================
    function calculateAndShow() {
        // 计算风险总分（原始权重和）
        let riskScore = 0;
        riskFactors.forEach(f => {
            const idx = selections[f.id];
            riskScore += f.options[idx].score;
        });

        // 计算保护总分（原始权重和）
        let protScore = 0;
        protectiveFactors.forEach(f => {
            const idx = selections[f.id];
            protScore += f.options[idx].score;
        });

        // 最终得分（与 Python 代码完全一致）
        const totalScore = (riskScore * RISK_COEFF) - (protScore * PROT_COEFF) + OFFSET;
        const displayScore = Math.min(100, Math.max(0, totalScore));

        // 风险等级
        let level, advice, cssClass;
        if (displayScore <= 20) {
            level = '低风险';
            advice = '保持良好生活习惯，定期关注健康。';
            cssClass = 'risk-low';
        } else if (displayScore <= 45) {
            level = '中等风险';
            advice = '建议改善饮食和生活方式。如有疑虑可咨询医生。';
            cssClass = 'risk-medium';
        } else if (displayScore <= 70) {
            level = '高风险';
            advice = '建议咨询消化科医生，进行进一步评估。';
            cssClass = 'risk-high';
        } else {
            level = '极高风险';
            advice = '请尽快就医，进行胃镜等相关检查。';
            cssClass = 'risk-veryhigh';
        }

        // 更新界面
        document.getElementById('totalScore').textContent = displayScore.toFixed(2);
        const badge = document.getElementById('riskBadge');
        badge.textContent = level;
        badge.className = 'risk-badge ' + cssClass;
        document.getElementById('adviceText').textContent = advice;

        // 详细得分表
        const table = document.getElementById('detailTable');
        table.innerHTML = '';

        let riskDetail = '';
        riskFactors.forEach(f => {
            const idx = selections[f.id];
            const raw = f.options[idx].score;
            const weighted = raw * RISK_COEFF;
            if (weighted > 0.01) {
                riskDetail += `<tr><td class="factor-name">${f.label}</td><td class="factor-score">${weighted.toFixed(2)}</td></tr>`;
            }
        });
        let protDetail = '';
        protectiveFactors.forEach(f => {
            const idx = selections[f.id];
            const raw = f.options[idx].score;
            const weighted = raw * PROT_COEFF;
            if (weighted > 0.01) {
                protDetail += `<tr><td class="factor-name">${f.label}</td><td class="factor-score">${weighted.toFixed(2)}</td></tr>`;
            }
        });

        if (riskDetail) {
            table.innerHTML += `<tr><td colspan="2" style="font-weight:600; padding-top:8px;">风险因素</td></tr>`;
            table.innerHTML += riskDetail;
        }
        if (protDetail) {
            table.innerHTML += `<tr><td colspan="2" style="font-weight:600; padding-top:8px;">保护因素</td></tr>`;
            table.innerHTML += protDetail;
        }
        if (!riskDetail && !protDetail) {
            table.innerHTML = `<tr><td colspan="2" style="text-align:center; color:#888;">所有选项均为最低风险或无暴露</td></tr>`;
        }

        document.getElementById('resultArea').style.display = 'block';
    }

    // ============================================
    // 重置
    // ============================================
    document.getElementById('resetBtn').addEventListener('click', function() {
        // 重置所有选择为第一个选项
        riskFactors.forEach(f => selections[f.id] = 0);
        protectiveFactors.forEach(f => selections[f.id] = 0);
        document.querySelectorAll('.question').forEach(q => {
            const firstBtn = q.querySelector('.options button');
            if (firstBtn) {
                q.querySelectorAll('.options button').forEach(b => b.classList.remove('selected'));
                firstBtn.classList.add('selected');
            }
        });
        document.getElementById('resultArea').style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // ============================================
    // 切换详细得分显示
    // ============================================
    document.getElementById('detailToggle').addEventListener('click', function() {
        const table = document.getElementById('detailTable');
        if (table.style.display === 'table') {
            table.style.display = 'none';
            this.textContent = '📋 查看详细得分';
        } else {
            table.style.display = 'table';
            this.textContent = '📋 隐藏详细得分';
        }
    });

    // ============================================
    // 初始化
    // ============================================
    renderQuestions();
    window.addEventListener('load', function() {
        // 确保默认选中状态正确
        document.querySelectorAll('.question').forEach(q => {
            const firstBtn = q.querySelector('.options button');
            if (firstBtn) {
                q.querySelectorAll('.options button').forEach(b => b.classList.remove('selected'));
                firstBtn.classList.add('selected');
            }
        });
        // 初次计算并显示结果
        calculateAndShow();
    });
</script>
</body>
</html>
